name: Validate and publish TTC trial
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttc-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vuepress/dist
  recovery-ready:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Require independently verified recovery point
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            ready=$(git ls-remote origin "refs/tags/recovery-ready/${GITHUB_SHA}" | cut -f1)
            if [ "$ready" = "$GITHUB_SHA" ]; then
              echo "TTC server recovery point is verified for ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "No verified independent recovery point; Pages deployment remains blocked." >&2
          exit 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, recovery-ready]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  notify-search:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .artifacts
      - run: mkdir -p .published && tar -xf .artifacts/artifact.tar -C .published
      - run: python3 scripts/indexnow.py --root .published
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
